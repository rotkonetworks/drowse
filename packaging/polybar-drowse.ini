; drowse power-save battery module for polybar.
;
; The label color + a SAVE tag reflect drowse's power-save mode:
;   green "BAT NN% SAVE" = power-save active
;   yellow "BAT NN%"     = on battery, not saving
;   blue "BAT NN%"       = on AC
; Left-click toggles power-save. Hardened: `timeout 2` means the script can
; never hang the bar; on any failure it falls back to a plain BAT label.
; Use a custom/script (not internal/battery): internal modules ignore
; click-left in polybar 3.7, and only a script can color by drowse state.

[module/battery]
type = custom/script
exec = timeout 2 /usr/local/bin/drowse status --polybar 2>/dev/null || echo "BAT"
interval = 5
click-left = /usr/local/bin/drowse toggle
click-right = notify-send "drowse" "$(timeout 2 /usr/local/bin/drowse status 2>/dev/null)"
