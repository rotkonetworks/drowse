; drowse power-save toggle for polybar.
;
; A custom/script module that shows a BAT label colored by drowse's power-save
; mode (green = power-save on, yellow = on battery, blue = on AC) and toggles
; power-save on left-click. Add this module block to your polybar config and
; put `drowse-power` in a modules- list (e.g. replace the stock `battery`).
;
; The color lives in the script output (polybar %{F..} markup), so no module
; foreground settings are needed.

[module/drowse-power]
type = custom/script
; One colored BAT <pct>% label reflecting power-save mode.
exec = drowse status --polybar
; Re-read on the same cadence as the stock battery module.
interval = 5
; Left-click flips power-save; the label recolors on the next interval (<=5s).
click-left = drowse toggle
; Right-click shows the full status in a notification (optional; needs dunst).
click-right = notify-send "drowse" "$(drowse status)"
